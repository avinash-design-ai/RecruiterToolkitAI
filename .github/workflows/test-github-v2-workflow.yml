name: Test GitHub V2 Search Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-search-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure Playwright browser path
        run: |
          sudo mkdir -p /ms-playwright
          sudo chmod 777 /ms-playwright
          echo "PLAYWRIGHT_BROWSERS_PATH=/ms-playwright" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install --list

      - name: Run V2 workflow initialization test
        working-directory: backend/modules/RecruiterToolkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          python - <<'PY'
          import traceback

          from automation.browser import BrowserManager
          from workflows.search_workflow_v2 import SearchWorkflowV2

          browser = None

          try:
              print("==============================================")
              print("RECRUITER TOOLKIT V2 GITHUB WORKFLOW TEST")
              print("==============================================")

              print("")
              print("STEP 1 - Starting BrowserManager")
              print("----------------------------------------------")

              browser = BrowserManager(
                  profile="github-v2-test"
              )

              print("BrowserManager started successfully.")

              print("")
              print("STEP 2 - Creating Playwright page")
              print("----------------------------------------------")

              page = browser.new_page()

              print("Page created successfully.")

              print("")
              print("STEP 3 - Opening LinkedIn")
              print("----------------------------------------------")

              page.goto(
                  "https://www.linkedin.com/feed/",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              print("Current URL:")
              print(page.url)

              print("")
              print("Page title:")
              print(page.title())

              print("")
              print("STEP 4 - Creating SearchWorkflowV2")
              print("----------------------------------------------")

              workflow = SearchWorkflowV2(
                  page
              )

              print("SearchWorkflowV2 initialized successfully.")

              print("")
              print("STEP 5 - Checking workflow object")
              print("----------------------------------------------")

              print("Workflow class:")
              print(type(workflow).__name__)

              print("")
              print("==============================================")
              print("V2 WORKFLOW INITIALIZATION TEST PASSED")
              print("==============================================")

              print("")
              print("IMPORTANT:")
              print("No LinkedIn credentials were supplied.")
              print("No login verification was bypassed.")
              print("No search was executed.")
              print("")

          except Exception as ex:

              print("")
              print("==============================================")
              print("V2 WORKFLOW TEST FAILED")
              print("==============================================")

              print(str(ex))

              traceback.print_exc()

              raise

          finally:

              if browser:

                  print("")
                  print("Closing browser...")

                  try:
                      browser.close()
                  except Exception as close_error:
                      print(
                          f"Browser close warning: {close_error}"
                      )
          PY
