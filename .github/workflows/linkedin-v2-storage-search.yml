name: LinkedIn V2 Storage Search

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company"
        required: true
        default: "SmartWorks, LLC"
      location:
        description: "Location"
        required: true
        default: "New Jersey"
      max_profiles:
        description: "Maximum profiles"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  linkedin-v2-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore authenticated LinkedIn state
        env:
          LINKEDIN_STORAGE_STATE: ${{ secrets.LINKEDIN_STORAGE_STATE }}
        run: |
          test -n "$LINKEDIN_STORAGE_STATE"

          printf '%s' "$LINKEDIN_STORAGE_STATE" > linkedin_storage_state.json

          echo "Storage state file size:"
          wc -c linkedin_storage_state.json

          python - <<'PY'
          import json
          import hashlib

          with open("linkedin_storage_state.json", encoding="utf-8") as f:
              raw = f.read()

          print(
              "Storage state SHA256:",
              hashlib.sha256(raw.encode("utf-8")).hexdigest()
          )

          print(
              "Storage state bytes:",
              len(raw.encode("utf-8"))
          )

          state = json.loads(raw)

          cookies = state.get("cookies", [])

          print("Total cookies:", len(cookies))

          linkedin = [
              c for c in cookies
              if "linkedin.com" in c.get("domain", "")
          ]

          print("LinkedIn cookies:", len(linkedin))

          for c in linkedin:
              print(
                  "name=",
                  c.get("name"),
                  "domain=",
                  c.get("domain"),
                  "secure=",
                  c.get("secure"),
              )
          PY


          python - <<'PY'
          import json

          with open("linkedin_storage_state.json", encoding="utf-8") as f:
              state = json.load(f)

          if not isinstance(state, dict):
              raise SystemExit("Invalid storage state")

          if not state.get("cookies"):
              raise SystemExit("No cookies in storage state")

          print("Storage state validated.")
          print("Cookies:", len(state["cookies"]))
          PY

      - name: Run LinkedIn V2
        working-directory: backend/modules/RecruiterToolkit
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/modules/RecruiterToolkit
          COMPANY: ${{ inputs.company }}
          LOCATION: ${{ inputs.location }}
          MAX_PROFILES: ${{ inputs.max_profiles }}
          LINKEDIN_STORAGE_STATE: ${{ github.workspace }}/linkedin_storage_state.json
        run: |
          python test_search_v2_github.py

      - name: Prepare CSV result
        if: success()
        shell: bash
        run: |
          set -e

          echo "Looking for generated CSV..."

          CSV_FILE=$(find backend/modules/RecruiterToolkit/exports \
            -maxdepth 1 \
            -type f \
            -name "*.csv" \
            | head -n 1)

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: No CSV file was generated."
            exit 1
          fi

          echo "CSV generated:"
          echo "$CSV_FILE"

          CSV_NAME=$(basename "$CSV_FILE")

          echo "CSV_NAME=$CSV_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p github-result

          cp "$CSV_FILE" "github-result/$CSV_NAME"

          echo "Prepared:"
          ls -lh github-result/

      - name: Upload CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-v2-results
          path: github-result/*.csv
          if-no-files-found: error