name: Build Recruiter Toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Recruiter Toolkit
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m PyInstaller --clean --noconfirm RecruiterToolkitV1.spec

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "backend/modules/RecruiterToolkit/dist/RecruiterToolkitV1/RecruiterToolkitV1.exe"

          Write-Host "Checking:"
          Write-Host $exe

          if (!(Test-Path $exe)) {
              Write-Error "RecruiterToolkitV1.exe was NOT created."
              exit 1
          }

          $file = Get-Item $exe

          Write-Host "EXE successfully created."
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "Path: $($file.FullName)"

      - name: Create ZIP
        shell: powershell
        run: |
          $source = "backend/modules/RecruiterToolkit/dist/RecruiterToolkitV1"
          $zip = "RecruiterToolkitV1.zip"

          Compress-Archive -Path "$source\*" -DestinationPath $zip -Force

          $file = Get-Item $zip

          Write-Host "ZIP successfully created."
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "Path: $($file.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecruiterToolkitV1-Windows
          path: RecruiterToolkitV1.zip
          if-no-files-found: error
