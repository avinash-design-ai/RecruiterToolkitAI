name: Build Recruiter Toolkit V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Show repository files
        shell: pwsh
        run: |
          Write-Host "=== RecruiterToolkit directory ==="
          Get-ChildItem "backend/modules/RecruiterToolkit" -Force

          Write-Host "=== V2 spec file ==="
          Get-Item "backend/modules/RecruiterToolkit/RecruiterToolkitV2.spec"

      - name: Build Recruiter Toolkit V2
        run: |
          python -m PyInstaller --clean --noconfirm backend/modules/RecruiterToolkit/RecruiterToolkitV2.spec

      - name: Locate build output
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "V2 BUILD OUTPUT SEARCH"
          Write-Host "======================================"

          Write-Host "All EXE files:"
          Get-ChildItem "." -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "Searching for RecruiterToolkitV2.exe..."

          $exe = Get-ChildItem "." -Recurse -Filter "RecruiterToolkitV2.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host ""
            Write-Host "ERROR: RecruiterToolkitV2.exe was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "V2 BUILD SUCCESSFUL"
          Write-Host "======================================"
          Write-Host "EXE:"
          Write-Host $exe.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host $exe.Length

      - name: Package Windows application
        shell: pwsh
        run: |
          $exe = Get-ChildItem "." -Recurse -Filter "RecruiterToolkitV2.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "ERROR: RecruiterToolkitV2.exe not found."
            exit 1
          }

          $buildFolder = $exe.Directory.FullName

          Write-Host "======================================"
          Write-Host "PACKAGING V2 APPLICATION"
          Write-Host "======================================"
          Write-Host "Build folder:"
          Write-Host $buildFolder

          Compress-Archive `
            -Path "$buildFolder" `
            -DestinationPath "RecruiterToolkitV2-Windows.zip" `
            -Force

          Write-Host ""
          Write-Host "Package created:"
          Get-Item "RecruiterToolkitV2-Windows.zip"

      - name: Verify ZIP package
        shell: pwsh
        run: |
          if (-not (Test-Path "RecruiterToolkitV2-Windows.zip")) {
            Write-Host "ERROR: ZIP package was not created."
            exit 1
          }

          Write-Host "======================================"
          Write-Host "V2 ZIP PACKAGE READY"
          Write-Host "======================================"

          Get-Item "RecruiterToolkitV2-Windows.zip" |
            Select-Object FullName, Length

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RecruiterToolkitV2-Windows
          path: RecruiterToolkitV2-Windows.zip
          if-no-files-found: error