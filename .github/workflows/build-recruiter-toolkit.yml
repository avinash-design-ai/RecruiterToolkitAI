name: Build Recruiter Toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Recruiter Toolkit
        run: |
          python -m PyInstaller --clean --noconfirm backend/modules/RecruiterToolkit/RecruiterToolkitV1.spec

      - name: Verify build
        shell: pwsh
        run: |
          Write-Host "Checking dist directory..."
          Get-ChildItem -Path backend/modules/RecruiterToolkit/dist -Recurse

      - name: Package EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path backend/modules/RecruiterToolkit/dist `
            -Filter "RecruiterToolkitV1.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $exe) {
            Write-Host "RecruiterToolkitV1.exe not found. Contents of dist:"
            Get-ChildItem -Path backend/modules/RecruiterToolkit/dist -Recurse
            exit 1
          }

          Compress-Archive `
            -Path $exe.FullName `
            -DestinationPath "${{ github.workspace }}\RecruiterToolkit-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RecruiterToolkit-Windows
          path: RecruiterToolkit-Windows.zip
          if-no-files-found: error
