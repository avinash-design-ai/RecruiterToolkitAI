name: Build Recruiter Toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Recruiter Toolkit
        run: |
          python -m PyInstaller --clean --noconfirm backend/modules/RecruiterToolkit/RecruiterToolkitV1.spec

      - name: Verify build
        shell: pwsh
        run: |
          $build = "backend/modules/RecruiterToolkit/dist/RecruiterToolkitV1"

          if (-not (Test-Path "$build/RecruiterToolkitV1.exe")) {
            Write-Host "Build output not found."
            Get-ChildItem "backend/modules/RecruiterToolkit/dist" -Recurse
            exit 1
          }

          Write-Host "Build successful:"
          Get-ChildItem $build -Recurse

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "backend/modules/RecruiterToolkit/dist/RecruiterToolkitV1" `
            -DestinationPath "RecruiterToolkitV1-Windows.zip" `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RecruiterToolkitV1-Windows
          path: RecruiterToolkitV1-Windows.zip
          if-no-files-found: error
