name: Test Recruiter Toolkit EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend/modules/RecruiterToolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Recruiter Toolkit
        run: |
          python -m PyInstaller --clean --noconfirm backend/modules/RecruiterToolkit/RecruiterToolkitV1.spec

      - name: Find EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "." -Recurse -Filter "RecruiterToolkitV1.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "ERROR: EXE not found"
            exit 1
          }

          Write-Host "EXE FOUND:"
          Write-Host $exe.FullName

      - name: Launch EXE test
        shell: pwsh
        run: |
          $exe = Get-ChildItem "." -Recurse -Filter "RecruiterToolkitV1.exe" |
            Select-Object -First 1

          Write-Host "Launching:"
          Write-Host $exe.FullName

          $process = Start-Process `
            -FilePath $exe.FullName `
            -WorkingDirectory $exe.Directory.FullName `
            -PassThru

          Write-Host "PID: $($process.Id)"

          Start-Sleep -Seconds 15

          $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue

          if (-not $running) {
            Write-Host "ERROR: Application exited during startup."
            exit 1
          }

          Write-Host "================================"
          Write-Host "EXE STARTED SUCCESSFULLY"
          Write-Host "================================"

          Stop-Process -Id $process.Id -Force

          Write-Host "Test completed successfully."
