{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg">

                <div class="card-body p-5">

                    <h2 class="mb-3">
                        🔍 LinkedIn Automation
                    </h2>

                    <p class="text-muted mb-4">
                        Search LinkedIn employees by company and location and export the results to CSV.
                    </p>

                    <form id="linkedinForm">

                        <div class="row">

                            <div class="col-md-5 mb-3">

                                <label class="form-label fw-bold">
                                    Company Name
                                </label>

                                <input
                                    type="text"
                                    id="company"
                                    class="form-control"
                                    placeholder="TEKsystems"
                                    required>

                            </div>

                            <div class="col-md-5 mb-3">

                                <label class="form-label fw-bold">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    id="location"
                                    class="form-control"
                                    placeholder="Dallas"
                                    required>

                            </div>

                            <div class="col-md-2 mb-3">

                                <label class="form-label fw-bold">
                                    Maximum Profiles
                                </label>

                                <input
                                    type="number"
                                    id="max_profiles"
                                    class="form-control"
                                    value="250"
                                    min="1"
                                    max="250">

                            </div>

                        </div>

                        <div class="mt-3">

                            <button
                                id="startBtn"
                                type="submit"
                                class="btn btn-primary">

                                ▶ Start Search

                            </button>

                            <button
                                id="stopBtn"
                                type="button"
                                class="btn btn-danger ms-2"
                                disabled>

                                ⏹ Stop Search

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div id="status"></div>

                    <div id="results"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const form = document.getElementById("linkedinForm");

const startBtn = document.getElementById("startBtn");

const stopBtn = document.getElementById("stopBtn");


//------------------------------------------------------
// Start Search
//------------------------------------------------------

form.addEventListener("submit", async function(e){

    e.preventDefault();

    startBtn.disabled = true;
    stopBtn.disabled = false;

    startBtn.innerHTML = "Searching...";

    document.getElementById("results").innerHTML = "";

    document.getElementById("status").innerHTML = `

        <div class="alert alert-info">

            <div class="spinner-border spinner-border-sm me-2"></div>

            Running LinkedIn Automation...

        </div>

    `;

    try{

        const response = await fetch("/linkedin",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                company:document.getElementById("company").value,

                location:document.getElementById("location").value,

                max_profiles:parseInt(
                    document.getElementById("max_profiles").value
                )

            })

        });

        const data = await response.json();

        if (data.login_required) {

            document.getElementById("status").innerHTML = `
                <div class="alert alert-warning">
                    <h5>🔒 LinkedIn Login Required</h5>
                    <p>${data.message}</p>
                </div>
            `;

         return;
     }

        if(!response.ok){

            document.getElementById("status").innerHTML=`

                <div class="alert alert-danger">

                    ${data.detail || data.message || "LinkedIn search failed."}

                </div>

            `;

            return;

        }

        document.getElementById("status").innerHTML=`

            <div class="alert alert-success">

                <h5>

                    ✅ Search Completed Successfully

                </h5>

                <br>

                Profiles Found :
                <strong>${data.count}</strong>

            </div>

        `;

        document.getElementById("results").innerHTML=`

            <a
                class="btn btn-success"
                href="/linkedin/download/${encodeURIComponent(data.filename)}">

                ⬇ Download CSV

            </a>

        `;

    }

    catch(err){

        document.getElementById("status").innerHTML=`

            <div class="alert alert-danger">

                ${err.message}

            </div>

        `;

    }

    finally{

        startBtn.disabled = false;

        stopBtn.disabled = true;

        startBtn.innerHTML = "▶ Start Search";

    }

});


//------------------------------------------------------
// Stop Search
//------------------------------------------------------

stopBtn.addEventListener("click", async function(){

    stopBtn.disabled = true;

    document.getElementById("status").innerHTML = `

        <div class="alert alert-warning">

            <div class="spinner-border spinner-border-sm me-2"></div>

            Stop request sent.

            Waiting for current page to finish...

        </div>

    `;

    try{

        await fetch("/linkedin/stop",{

            method:"POST"

        });

    }

    catch(err){

        console.log(err);

    }

});

</script>

{% endblock %}
